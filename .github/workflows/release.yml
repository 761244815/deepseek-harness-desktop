name: Desktop release

on:
  push:
    branches: [main]
    paths:
      - assets/**
      - lib/**
      - scripts/**
      - shell/**
      - main.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - preload.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm ensure-electron

      - name: Test desktop shell
        run: pnpm test

      - name: Validate official npm runtime
        run: pnpm smoke:npm-runtime

      - name: Stamp release version
        shell: pwsh
        env:
          RELEASE_VERSION: 0.2.${{ github.run_number }}
        run: npm pkg set version="$env:RELEASE_VERSION"

      - name: Build Windows release
        run: pnpm exec electron-builder --win nsis portable --publish never

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: 0.2.${{ github.run_number }}
        run: |
          @"
          Windows desktop shell for the official ``@deepseek-ai/dsh`` npm release.

          Harness starts from the last verified local runtime. New npm releases
          are downloaded in the background and activated with health-check rollback.

          Desktop commit: ``${{ github.sha }}``

          Packages are unsigned.
          "@ | Set-Content -Encoding utf8 release-notes.md

          $assets = Get-ChildItem dist -File | Where-Object {
            $_.Extension -in ".exe", ".blockmap" -or $_.Name -eq "latest.yml"
          } | Select-Object -ExpandProperty FullName
          if (-not ($assets | Where-Object { $_ -like "*.exe" })) {
            throw "No Windows executable was produced"
          }
          if (-not ($assets | Where-Object { $_ -like "*latest.yml" })) {
            throw "No electron-updater metadata was produced"
          }

          gh release create "v$env:RELEASE_VERSION" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "DeepSeek Harness Desktop $env:RELEASE_VERSION" `
            --notes-file release-notes.md `
            --latest `
            @assets
